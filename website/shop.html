<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop · Pipo Toys</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html#home">Pipo <span>Toys</span></a>
    <nav class="nav">
      <a href="index.html#shop">Shop</a>
      <a href="index.html#workshop">The workshop</a>
      <span class="cart-pill">Cart <strong data-cart-count>0</strong></span>
    </nav>
  </header>

  <main class="page">
    <section class="page-intro">
      <p class="eyebrow">Shop</p>
      <h1>Add something to the cart.</h1>
      <p class="lede">Each button sends a dataLayer push. The code is in <code>js/shop.js</code>.</p>
    </section>
    <section class="product-grid" data-product-grid></section>
  </main>

  <footer class="site-footer">
    <p class="fine-print">Prices are unit prices. One click adds one unit.</p>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
